version: 2

models:
  - name: fct_cpi_trend
    description: >
      ...
    columns:
      - name: time_period
        tests:
          - not_null
          - unique
      - name: cpi_pct_change_yoy
        tests:
          - not_null

  - name: fct_bank_products_latest
    description: >
      ...
    columns:
      - name: product_id
        tests:
          - not_null
      - name: bank
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null

  - name: fct_bank_rates_latest
    description: >
      Latest known interest rate per product/rate-type, joined with
      product name and category. The table the dashboard should query
      for rate comparisons across banks.
    columns:
      - name: product_id
        tests:
          - not_null
      - name: bank
        tests:
          - not_null
      - name: rate
        tests:
          - not_null